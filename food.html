  <!-- ======================================================================
       THE PHOTO GRID
       ======================================================================
       ✏️ TO ADD A PHOTO: drop the image file into the images/ folder, then
       copy this block and change the filename and the alt text:

         <figure>
           <img src="images/food-9.jpg" loading="lazy"
                alt="A dish I cooked">
         </figure>

       The grid re-flows on its own — 4 across on a laptop, 2 on a tablet,
       1 on a phone — so you never need to touch the layout. To remove a
       photo, delete its block. To reorder, move the blocks around.

       ⚠️ ALT TEXT: the alt="…" lines below are generic placeholders. As you
       swap in real photos, please replace them with a short description of
       what's actually in each picture (e.g. "A tray of burnt-butter
       cookies") — that's what screen readers read out.
       ====================================================================== -->
  <main class="container">
    <div class="food-grid" data-lightbox-group>

      <figure>
        <img src="images/food-1.jpg" width="1200" height="1600" loading="lazy" alt="A dish I cooked">
